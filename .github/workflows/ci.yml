name: CI

# Runs the three offline test suites (no API key needed), builds the Docker
# image, then re-runs the same suites inside the built image.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "phase2/dev"]

jobs:
  test-and-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run logic_manager tests (hardcoded sample AI responses)
        run: python test_logic_manager.py

      - name: Run ai_manager tests (stubbed API connector)
        run: python test_ai_manager.py

      - name: Run end-to-end tests (fake AI responses)
        run: python test_end_to_end.py

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag incident-triage:${{ github.sha }}

      - name: Re-run all three test suites inside the Docker image
        run: |
          docker run --rm incident-triage:${{ github.sha }} python test_logic_manager.py
          docker run --rm incident-triage:${{ github.sha }} python test_ai_manager.py
          docker run --rm incident-triage:${{ github.sha }} python test_end_to_end.py
