name: CD

# Deploys the Docker image to Azure App Service. Runs manually from the
# Actions tab (CD → Run workflow) until automatic deploys are enabled.
#
# The image deployed here is the EXACT artifact the Dockerfile defines
# for the same commit — the deployment promotes the tested image instead
# of rebuilding the code on the platform runtime.
#
# ONE-TIME SETUP (Azure portal):
#   1. Create an App Service (Linux) and an Azure Database for PostgreSQL
#      Flexible Server.
#   2. App Service → Environment variables:
#        DATABASE_URL  = the PostgreSQL connection string
#        ZAI_KEY       = the Z.ai API key
#        SECRET_KEY    = a long random string (sessions/CSRF)
#        WEBSITES_PORT = 5000   (the port app.py listens on)
#   3. App Service → Overview → "Download publish profile"; store its XML
#      content as the GitHub repository secret AZURE_PUBLISH_PROFILE.
#   4. Set "app-name" below to your App Service name.
#   5. FIRST RUN ONLY: the workflow pushes the image to GHCR as a PRIVATE
#      package. Open the repository's Packages page and set the package
#      to Public so App Service can pull it without registry credentials
#      (or keep it private and add DOCKER_REGISTRY_* credentials on the
#      App Service instead).
#   6. Authentication (Easy Auth): require login, allow-list the team's
#      emails so the public URL stays team-only.
#
# The startup command overrides the image's default CMD (the terminal
# app) so the deployed container serves the web dashboard; locally the
# image still runs the CLI, and the Dockerfile itself stays untouched.

on:
  workflow_dispatch:
  # push:
  #   branches: [phase3/dev]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: incident-triage

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image name (GHCR paths must be lowercase)
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image
        run: |
          docker build . --file Dockerfile --tag "$IMAGE"
          docker push "$IMAGE"

      - name: Deploy the image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: incident-triage        # <- set to your App Service name
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}
          startup-command: startup.sh      # overrides the image's CLI CMD

      - name: Post-deploy smoke test
        # The pipeline verifies its own deployments: the site must answer
        # HTTP 200 (or 302 → the Easy Auth login page) within ~2 minutes
        # of the deploy, or this workflow fails. Update the URL if you
        # rename the App Service.
        run: |
          sleep 30
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://incident-triage.azurewebsites.net/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "App is up: HTTP $code"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code — retrying in 20s"
            sleep 20
          done
          echo "Smoke test failed: the app did not respond after deployment"
          exit 1
