name: CD

# Deploys the Docker image to Azure App Service (`inf1103` in RG `devops`).
# Runs manually from the Actions tab (CD → Run workflow) until automatic
# deploys are enabled.
#
# GitHub repository secrets required:
#   - AZURE_PUBLISH_PROFILE : XML downloaded from App Service → Overview
#   - ACR_USERNAME          : inf1103.azurecr.io registry username
#   - ACR_PASSWORD          : inf1103.azurecr.io registry password
#
# Azure App Service settings already configured for this app:
#   - WEBSITE_SITE_NAME     : injected automatically by Azure (activates ProxyFix)
#   - DATABASE_URL          : Azure Database for PostgreSQL connection string
#   - ZAI_KEY               : Z.ai API key
#   - SECRET_KEY            : Flask session & CSRF signing key
#   - WEBSITES_PORT         : 5000

on:
  workflow_dispatch:
  push:
    branches: [cd/azure-app-service]

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: inf1103.azurecr.io
  IMAGE_NAME: incident-triage
  AZURE_APP_NAME: inf1103

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        run: echo "IMAGE=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ env.ACR_LOGIN_SERVER }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push image to ACR
        run: |
          docker build . --file Dockerfile --tag "$IMAGE" --tag "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          docker push "$IMAGE"
          docker push "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"

      - name: Deploy image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}
          startup-command: /bin/sh /app/startup.sh

      - name: Post-deploy smoke test
        # The site must return HTTP 200 (or 302 / 401 from the Easy Auth gate).
        run: |
          sleep 30
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" -H "Accept: text/html" "https://${AZURE_APP_NAME}.azurewebsites.net/" || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "401" ]; then
              echo "App is up: HTTP $code"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code — retrying in 20s"
            sleep 20
          done
          echo "Smoke test failed: the app did not respond after deployment"
          exit 1
